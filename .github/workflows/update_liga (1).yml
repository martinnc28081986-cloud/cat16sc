name: Actualizar datos LISFI

on:
  schedule:
    # Sábado a martes, 22:00 de Argentina.
    # GitHub usa UTC y Argentina es UTC-3 (sin horario de verano), así que las 22:00
    # de acá son la 01:00 UTC del DÍA SIGUIENTE. Por eso los días van corridos uno:
    #   dom(0) 01:00 UTC = sábado 22:00 ART
    #   lun(1) 01:00 UTC = domingo 22:00 ART
    #   mar(2) 01:00 UTC = lunes 22:00 ART
    #   mié(3) 01:00 UTC = martes 22:00 ART
    - cron: '0 1 * * 0,1,2,3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-liga:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml

      - name: Ejecutar scraper LISFI
        run: python scrape_lisfi.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add liga_data.json
          if git diff --staged --quiet; then
            echo "Sin cambios — forzando commit para mantener workflow activo"
            git commit --allow-empty -m "keep-alive: $(TZ='America/Argentina/Buenos_Aires' date +'%d/%m/%Y %H:%M ART')"
          else
            git commit -m "Auto: datos LISFI $(TZ='America/Argentina/Buenos_Aires' date +'%d/%m/%Y %H:%M ART')"
          fi
          git push
