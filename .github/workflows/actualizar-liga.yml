name: Actualizar liga_data.json

on:
  schedule:
    - cron: '0 1 * * 0,1,2,3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liga-data
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --quiet requests beautifulsoup4 lxml

      - name: Scrapear las zonas activas
        # ── MODO RECUPERACIÓN — TEMPORAL ──
        # Baja SOLO la Zona II B 2026. No toca liga_data.json.
        # DESPUÉS DE LA CORRIDA hay que sacar este bloque env.
        env:
          LISFI_ZONA_URL: https://www.lisfi.com.ar/index.php/liga-2b-2026
          LIGA_ID: lisfi-ii-zona-b-2026
        run: python scrape_lisfi.py

      - name: Commitear si cambió
        run: |
          if [[ -n "$(git status --porcelain -- 'liga_data*.json')" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add liga_data*.json
            echo "Archivos que cambiaron:"
            git diff --cached --name-only | sed 's/^/  /'
            git commit -m "Recuperar Zona II B 2026"
            git push
            echo "✅ Listo"
          else
            echo "Sin cambios"
          fi
